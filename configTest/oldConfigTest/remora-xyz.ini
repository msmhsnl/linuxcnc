# Basic LinuxCNC config for testing of Remora firmware

[EMC]
MACHINE = Remora-8AXIS
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
EDITOR = gedit
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
ARCDIVISION = 64
GRIDS = 10mm 20mm 50mm 100mm
MAX_FEED_OVERRIDE = 10
MIN_SPINDLE_OVERRIDE = 0
MAX_SPINDLE_OVERRIDE = 1
DEFAULT_LINEAR_VELOCITY = 30.00
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 50.00
DEFAULT_ANGULAR_VELOCITY = 36.00
MIN_ANGULAR_VELOCITY = 0
MAX_ANGULAR_VELOCITY = 45.00
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = 50mm 10mm 5mm 1mm .5mm .1mm .05mm .01mm

DEFAULT_SPINDLE_0_SPEED = 500
MIN_SPINDLE_0_SPEED = 100
MAX_SPINDLE_0_SPEED = 24000
MIN_SPINDLE_0_OVERRIDE = 0.5
MAX_SPINDLE_0_OVERRIDE = 2.0
MAX_SPINDLE_POWER = 1500
PYVCP = custompanel.xml

[KINS]
JOINTS = 8
KINEMATICS = trivkins coordinates=XYZABCUV

[FILTER]
PROGRAM_EXTENSION = .py Python Script
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT = 0.010
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = remora-xyz.hal
HALUI = halui
POSTGUI_HALFILE = postgui_call_list.hal

[TRAJ]
COORDINATES = X Y Z A B C U V
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
CYCLE_TIME = 0.010
DEFAULT_LINEAR_VELOCITY = 100.00
MAX_LINEAR_VELOCITY = 300.00
NO_FORCE_HOMING = 1 
SPINDLES = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[AXIS_X]
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
MIN_LIMIT = -0.01
MAX_LIMIT = 300.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -5.0
MAX_LIMIT = 300.0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
STEPGEN_MAXACCEL = 600.0
SCALE = 333.33
FERROR = 5
MIN_FERROR = 1.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
FF1_GAIN = 1
P_GAIN = 1
DEADBAND=0.01

[AXIS_Y]
MAX_VELOCITY = 80.0
MAX_ACCELERATION = 400.0
MIN_LIMIT = -0.01
MAX_LIMIT = 300.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -5.0
MAX_LIMIT = 300.0
MAX_VELOCITY = 80.0
MAX_ACCELERATION = 400.0
STEPGEN_MAXACCEL = 2000.0
SCALE = 100.0
FERROR = 9.0
MIN_FERROR = 5.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
FF1_GAIN = 1
P_GAIN = 1
DEADBAND = 0.01

[AXIS_Z]
OFFSET_AV_RATIO = 0.2
MAX_VELOCITY = 5.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -280
MAX_LIMIT = 280

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -280
MAX_LIMIT = 280
MAX_VELOCITY = 5.0
MAX_ACCELERATION = 200.0
STEPGEN_MAXACCEL = 3000.0
SCALE = 50.0
FERROR = 5
MIN_FERROR = 1.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
FF1_GAIN = 1
P_GAIN = 1
DEADBAND = 0.01

# A Axis (Joint 3) - Rotary axis with NEMA 17 + TB6600 (1/16 microstep)
# NEMA 17: 200 steps/rev, TB6600 1/16: 3200 steps/rev
# SCALE = 3200 / 360 = 8.889 steps/degree
[AXIS_A]
MAX_VELOCITY = 45.0
MAX_ACCELERATION = 360.0
MIN_LIMIT = -99999.0
MAX_LIMIT = 99999.0

[JOINT_3]
TYPE = ANGULAR
HOME = 0.0
MIN_LIMIT = -99999.0
MAX_LIMIT = 99999.0
MAX_VELOCITY = 45.0
MAX_ACCELERATION = 360.0
STEPGEN_MAXACCEL = 400.0
SCALE = 8.889
FERROR = 5.0
MIN_FERROR = 1.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
FF1_GAIN = 1.0
P_GAIN = 1.0
DEADBAND = 0.1

# B Axis (Joint 4) - Same motor as X axis
[AXIS_B]
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
MIN_LIMIT = -0.01
MAX_LIMIT = 300.0

[JOINT_4]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -5.0
MAX_LIMIT = 300.0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
STEPGEN_MAXACCEL = 600.0
SCALE = 333.33
FERROR = 2
MIN_FERROR = 2.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
FF1_GAIN = 1
P_GAIN = 1
DEADBAND=0.01

# C Axis (Joint 5) - Same motor as X axis
[AXIS_C]
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
MIN_LIMIT = -0.01
MAX_LIMIT = 300.0

[JOINT_5]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -5.0
MAX_LIMIT = 300.0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
STEPGEN_MAXACCEL = 600.0
SCALE = 333.33
FERROR = 2
MIN_FERROR = 2.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
FF1_GAIN = 1
P_GAIN = 1
DEADBAND=0.01

# U Axis (Joint 6) - Same motor as X axis
[AXIS_U]
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
MIN_LIMIT = -0.01
MAX_LIMIT = 300.0

[JOINT_6]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -5.0
MAX_LIMIT = 300.0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
STEPGEN_MAXACCEL = 600.0
SCALE = 333.33
FERROR = 2
MIN_FERROR = 2.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
FF1_GAIN = 1
P_GAIN = 1
DEADBAND=0.01

# V Axis (Joint 7) - Same motor as X axis
[AXIS_V]
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
MIN_LIMIT = -0.01
MAX_LIMIT = 300.0

[JOINT_7]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -5.0
MAX_LIMIT = 300.0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500.0
STEPGEN_MAXACCEL = 600.0
SCALE = 333.33
FERROR = 2
MIN_FERROR = 2.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
FF1_GAIN = 1
P_GAIN = 1
DEADBAND=0.01

[SPINDLE_0]
TYPE = pwm
ENCODER = encoder.0
ENCODER_SCALE = 2000
MAX_REVS = 500000
MIN_REVS = 50
PWM_FREQ = 100000

[RIGID_TAPPING]
ENABLE = 1
MAX_ERROR = 10.0

#-------------------------------------------------------------------
# MPG HANDWHEEL CONFIGURATION
#-------------------------------------------------------------------
[MPG]
# MPG encoder counts per revolution (typical values: 100, 200, 400)
ENCODER_PPR = 100

# Scale values for each selector position (mm per encoder count)
# x1 position   - Fine adjustment
SCALE_0 = 0.001
# x10 position  - Normal adjustment  
SCALE_1 = 0.01
# x100 position - Coarse adjustment
SCALE_2 = 0.1
# x1000 position - Rapid positioning
SCALE_3 = 1.0
